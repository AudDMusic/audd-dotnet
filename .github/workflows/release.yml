name: Release

on:
  push:
    tags:
      - 'audd-dotnet/v*'
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Pack and publish to NuGet
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: dotnet pack
        run: dotnet pack src/AudD -c Release -o nupkgs
      - name: NuGet trusted-publishing login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: dotnet nuget push
        run: dotnet nuget push nupkgs/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
